# Compilacion del APK de Mis Finanzas en un host Linux alojado.
#
# Este flujo reproduce paso a paso lo que hace CONSTRUIR_APK.sh, que no puede
# ejecutarse en Windows porque pyside6-android-deploy solo funciona en Linux o
# macOS. Al ejecutarse en un entorno Linux de GitHub Actions no hace falta
# instalar WSL2, el SDK de Android ni el NDK en el equipo de desarrollo.
#
# El APK queda disponible de dos formas:
#   - Como artefacto descargable de la ejecucion (requiere comprimirlo).
#   - Adjunto a una release, para descargarlo directamente desde el telefono.

name: Construir APK de Android

# Solo manual: cada ejecucion descarga el SDK, el NDK y compila Qt para
# Android, de modo que no debe dispararse con cada cambio en el repositorio.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-android
  cancel-in-progress: false

jobs:
  apk:
    name: Compilar el APK
    runs-on: ubuntu-22.04

    # La primera compilacion descarga varios gigabytes y compila codigo nativo.
    timeout-minutes: 180

    env:
      # Debe coincidir con la version declarada en requirements.txt y con la
      # que usa el ejecutable de escritorio: los wheels de Android que se
      # descargan tienen que ser de la misma version que el PySide6 anfitrion.
      PYSIDE_VERSION: "6.11.2"

      # Python 3.11 y no 3.12 o superior: el [python] android_packages de
      # pysidedeploy.spec fija cython==0.29.33, que no compila en 3.12.
      PYTHON_VERSION: "3.11"

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Leer la version de la aplicacion
        run: |
          echo "VERSION=$(tr -d '[:space:]' < VERSION.txt)" >> "$GITHUB_ENV"
          echo "Version declarada: $(tr -d '[:space:]' < VERSION.txt)"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar las dependencias del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            build-essential ccache zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar PySide6, qtpip y buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==${PYSIDE_VERSION}"
          python -m pip install "buildozer==1.5.0" "cython==0.29.33"

          # PySide6 distribuye en requirements-android.txt los paquetes que
          # necesita pyside6-android-deploy (jinja2, pkginfo, tqdm y una version
          # concreta de packaging). Instalarlos desde ese mismo archivo evita
          # duplicar aqui versiones que podrian quedar desfasadas.
          REQUISITOS="$(python -c 'import pathlib, PySide6; print(pathlib.Path(PySide6.__file__).parent / "scripts" / "requirements-android.txt")')"
          python -m pip install -r "${REQUISITOS}"

          python -c "import PySide6; print('PySide6', PySide6.__version__)"

          # Falla pronto, y con un mensaje claro, si el despliegue no esta
          # disponible en este entorno.
          pyside6-android-deploy --help

      # No se usa el script tools/cross_compile_android de PySide6: descarga un
      # NDK (r27c) distinto del que exige pyside6-android-deploy (r26b) y lo
      # deja en una cache que la herramienta no consulta. Se prefiere que la
      # propia herramienta resuelva sus dependencias y se registra el estado del
      # entorno para poder diagnosticar cualquier fallo de resolucion.
      - name: Reconocer el entorno de Android
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-sin definir}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-sin definir}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-sin definir}"

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}/ndk" ]; then
            echo "--- NDK preinstalados en el ejecutor ---"
            ls -1 "${ANDROID_HOME}/ndk"
          else
            echo "El ejecutor no trae NDK: lo descargara pyside6-android-deploy."
          fi

          echo "--- Cache de pyside6-android-deploy ---"
          ls -1 "$HOME/.pyside6_android_deploy" 2>/dev/null \
            || echo "vacia"

      # buildozer y python-for-android exigen encontrar las herramientas del SDK
      # en rutas heredadas que las instalaciones modernas ya no usan: buildozer
      # busca sdkmanager en <sdk>/tools/bin y python-for-android busca avdmanager
      # en <sdk>/cmdline-tools/latest/bin, y aborta si no las ve. Ademas, cuando
      # el directorio del SDK ya existe, buildozer lo da por valido y no descarga
      # nada. Se le prepara por tanto un SDK con ambas rutas resueltas y con las
      # licencias ya aceptadas copiadas del SDK del ejecutor: sin licencias no
      # hay respuesta posible al aviso interactivo y los paquetes se omiten en
      # silencio.
      #
      # Las herramientas se copian y no se enlazan porque avdmanager deduce el
      # directorio del SDK a partir de su propia ubicacion: python-for-android lo
      # interroga para saber que plataformas hay instaladas, y con un enlace
      # responderia por el SDK del ejecutor en vez de por el de buildozer.
      - name: Preparar el SDK que esperan buildozer y python-for-android
        run: |
          CMDLINE="${ANDROID_HOME}/cmdline-tools/latest/bin"
          SDK_BUILDOZER="$HOME/.buildozer/android/platform/android-sdk"
          PLATAFORMA="31"

          yes | "${CMDLINE}/sdkmanager" --sdk_root="${ANDROID_HOME}" --licenses > /dev/null

          mkdir -p "${SDK_BUILDOZER}"
          cp -a "${ANDROID_HOME}/licenses" "${SDK_BUILDOZER}/"
          cp -aL "${ANDROID_HOME}/cmdline-tools" "${SDK_BUILDOZER}/"

          mkdir -p "${SDK_BUILDOZER}/tools/bin"
          printf '%s\n' '#!/usr/bin/env bash' \
            "exec \"${SDK_BUILDOZER}/cmdline-tools/latest/bin/sdkmanager\" \"\$@\"" \
            > "${SDK_BUILDOZER}/tools/bin/sdkmanager"
          chmod +x "${SDK_BUILDOZER}/tools/bin/sdkmanager"

          echo "--- Herramientas copiadas ---"
          ls -l "${SDK_BUILDOZER}/tools/bin" "${SDK_BUILDOZER}/cmdline-tools"

          # La compilacion se hace contra la plataforma que declara ANDROIDAPI.
          "${SDK_BUILDOZER}/tools/bin/sdkmanager" \
            --sdk_root="${SDK_BUILDOZER}" \
            "platform-tools" "platforms;android-${PLATAFORMA}"

          echo "--- Plataformas disponibles ---"
          ls -1 "${SDK_BUILDOZER}/platforms"

      # El asistente de PySide6 declara necesitar el NDK r26b, pero
      # python-for-android recomienda el 28c y con el r26b el compilador cruzado
      # no consigue enlazar ni el primer ejecutable de prueba de una receta. El
      # ejecutor ya trae el 28c instalado, de modo que se usa ese y no se
      # descarga nada.
      - name: Localizar el NDK de Android
        run: |
          NDK_PATH="$(ls -d "${ANDROID_HOME}/ndk/28."* 2>/dev/null | sort | tail -n 1)"

          if [ -z "${NDK_PATH}" ]; then
            NDK_PATH="${ANDROID_NDK_HOME}"
          fi

          # La herramienta busca exactamente este ejecutable dentro del NDK.
          test -x "${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readobj"

          # El ejecutor deja estas variables apuntando a otro NDK de los que
          # trae instalados; se alinean con el que se va a usar para que ninguna
          # herramienta tome el sysroot de una version y el compilador de otra.
          echo "NDK_PATH=${NDK_PATH}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${NDK_PATH}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> "$GITHUB_ENV"
          echo "NDK en uso: ${NDK_PATH}"

      # No se usa qtpip: su binario falla en el ejecutor por una biblioteca de
      # Qt ausente. Los wheels se descargan del servidor oficial de Qt, cada uno
      # de su propio directorio, y los nombres se resuelven leyendo el indice en
      # lugar de componerlos a mano: en la serie 6.11 el paquete paso a llamarse
      # "pyside6" en minusculas y los nombres publicados no son estables.
      - name: Descargar los wheels de Android
        run: |
          BASE="https://download.qt.io/official_releases/QtForPython"
          PATRON="-${PYSIDE_VERSION}-"

          mkdir -p "$HOME/ruedas"
          cd "$HOME/ruedas"

          curl -fsSL "${BASE}/pyside6/" -o indice_pyside.html
          curl -fsSL "${BASE}/shiboken6/" -o indice_shiboken.html

          NOMBRE_PYSIDE="$(grep -oE 'pyside6-[0-9.]+-[0-9.]+-cp[0-9]+-cp[0-9]+-android_aarch64\.whl' indice_pyside.html | grep -- "${PATRON}" | sort -u | head -n 1)"
          NOMBRE_SHIBOKEN="$(grep -oE 'shiboken6-[0-9.]+-[0-9.]+-cp[0-9]+-cp[0-9]+-android_aarch64\.whl' indice_shiboken.html | grep -- "${PATRON}" | sort -u | head -n 1)"

          if [ -z "${NOMBRE_PYSIDE}" ] || [ -z "${NOMBRE_SHIBOKEN}" ]; then
            echo "ERROR: no se localizaron los wheels de Android de ${PYSIDE_VERSION}."
            echo "PySide6:   '${NOMBRE_PYSIDE}'"
            echo "Shiboken6: '${NOMBRE_SHIBOKEN}'"
            exit 1
          fi

          curl -fL --retry 3 -O "${BASE}/pyside6/${NOMBRE_PYSIDE}"
          curl -fL --retry 3 -O "${BASE}/shiboken6/${NOMBRE_SHIBOKEN}"

          ls -lh

          echo "RUEDA_PYSIDE=${PWD}/${NOMBRE_PYSIDE}" >> "$GITHUB_ENV"
          echo "RUEDA_SHIBOKEN=${PWD}/${NOMBRE_SHIBOKEN}" >> "$GITHUB_ENV"
          echo "PySide6:   ${NOMBRE_PYSIDE}"
          echo "Shiboken6: ${NOMBRE_SHIBOKEN}"

      # El spec del repositorio deja las rutas de los wheels vacias porque
      # dependen de cada maquina: aqui se rellenan en la copia de trabajo.
      - name: Configurar el despliegue
        run: |
          sed -i "s|^wheel_pyside *=.*|wheel_pyside = ${RUEDA_PYSIDE}|" \
            pysidedeploy.spec
          sed -i "s|^wheel_shiboken *=.*|wheel_shiboken = ${RUEDA_SHIBOKEN}|" \
            pysidedeploy.spec

          grep -E '^(wheel_pyside|wheel_shiboken|mode|arch|input_file|icon) ' \
            pysidedeploy.spec

      # Aisla el fallo que impide compilar la primera receta: el compilador
      # cruzado del NDK no consigue crear un ejecutable de prueba. Se reproduce
      # aqui la misma invocacion, con y sin ccache, para saber cual de las dos
      # formas falla. Las ordenes llevan || echo para no abortar el trabajo y
      # poder ver el resultado completo.
      - name: Comprobar el compilador cruzado
        run: |
          NDK_BIN="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          BANDERAS="-target aarch64-linux-android21 -fomit-frame-pointer -march=armv8-a -fPIC"

          printf 'int main(void) { return 0; }\n' > /tmp/prueba.c

          echo "--- clang ---"
          "${NDK_BIN}/clang" --version || true

          echo "--- sysroot ---"
          ls -d "${SYSROOT}" || echo "no existe"

          echo "--- sin ccache ---"
          "${NDK_BIN}/clang" ${BANDERAS} -o /tmp/prueba1 /tmp/prueba.c \
            && echo "compila correctamente" || echo "FALLA sin ccache"

          echo "--- con ccache, como lo invoca python-for-android ---"
          /usr/bin/ccache "${NDK_BIN}/clang" ${BANDERAS} -o /tmp/prueba2 \
            /tmp/prueba.c && echo "compila correctamente" \
            || echo "FALLA con ccache"

      # --force evita el aviso interactivo de crear un entorno virtual (en el
      # ejecutor no hay terminal) y --verbose deja el registro completo para
      # poder diagnosticar un fallo de compilacion nativa.
      # --keep-deployment-files conserva el arbol de compilacion, de modo que si
      # algo falla el config.log de la receta sigue disponible para leerlo.
      - name: Compilar el APK
        run: |
          pyside6-android-deploy \
            --config-file pysidedeploy.spec \
            --ndk-path "${NDK_PATH}" \
            --force \
            --keep-deployment-files \
            --verbose

      - name: Reunir y firmar el APK
        run: |
          mkdir -p dist-android

          # buildozer deja el mismo APK en varios nombres dentro de bin/: se
          # publica una sola copia, con el nombre convenido por el proyecto.
          APK="$(find . -name '*arm64-v8a*debug.apk' -not -path './.git/*' -print -quit)"

          if [ -z "${APK}" ]; then
            APK="$(find . -name '*.apk' -not -path './.git/*' -print -quit)"
          fi

          if [ -z "${APK}" ]; then
            echo "====================================================="
            echo " La compilacion no genero APK. Ultimas lineas de los"
            echo " registros de configuracion de cada receta:"
            echo "====================================================="

            # pyside6-android-deploy termina con exito aunque buildozer falle, y
            # el motivo real de un fallo de compilacion nativa queda en el
            # config.log de la receta, que no se publica en el registro del
            # trabajo. Se imprime entero: la orden exacta que falla y el error
            # del compilador estan al principio, no al final.
            REGISTRO="$(find . -name 'config.log' -path '*libffi*' -print -quit 2>/dev/null)"

            if [ -z "${REGISTRO}" ]; then
              echo "No se conservo el config.log de libffi."
            else
              echo "--- ${REGISTRO} ---"
              head -n 200 "${REGISTRO}"
            fi

            exit 1
          fi

          RESULTADO="dist-android/MisFinanzas-${VERSION}-android.apk"

          # Gradle firma la compilacion con una clave que genera y descarta en
          # cada ejecucion: Android no admitiria instalar una version nueva
          # firmada con otra clave, y la unica salida seria desinstalar, con la
          # perdida de los datos del telefono. Por eso el APK se firma aqui con
          # la clave estable del repositorio, despues de alinearlo.
          #
          # La clave es la de depuracion del proyecto: no otorga ningun
          # privilegio —los canales de distribucion rechazan las compilaciones de
          # depuracion— y lo unico que se le pide es permanecer igual. Por eso
          # viaja en el repositorio y no en un secreto, que ademas resulta
          # inviable: un valor de este tamano impide que la ejecucion arranque.
          ZIPALIGN="$(find "${ANDROID_HOME}/build-tools" -name zipalign -type f | sort | tail -n 1)"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n 1)"

          "${ZIPALIGN}" -p -f 4 "${APK}" "${RESULTADO}"

          "${APKSIGNER}" sign \
            --ks .github/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            "${RESULTADO}"

          echo "--- Firma del APK publicado ---"
          "${APKSIGNER}" verify --print-certs "${RESULTADO}" | head -n 6

          ls -lh dist-android

      - name: Publicar el artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MisFinanzas-${{ env.VERSION }}-apk
          path: dist-android/*.apk
          if-no-files-found: error

      # La release permite descargar el APK directamente desde el telefono, sin
      # descomprimir el artefacto ni iniciar sesion.
      #
      # Se marca como prepublicacion a proposito: la aplicacion de escritorio
      # busca versiones nuevas en /releases/latest, que excluye las
      # prepublicaciones, y solo acepta adjuntos .exe. Sin esta marca, una
      # publicacion con un APK le haria creer que existe una version nueva del
      # instalador de Windows.
      - name: Adjuntar el APK a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${VERSION}" \
            --title "Mis Finanzas ${VERSION} para Android" \
            --notes "APK generado automaticamente. Descargalo en el telefono y abrelo para instalarlo; el sistema pedira autorizar la instalacion desde un origen desconocido." \
            --prerelease \
            --latest=false \
            dist-android/*.apk \
          || gh release upload "android-v${VERSION}" dist-android/*.apk --clobber
