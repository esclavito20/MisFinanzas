name: Prueba del secreto de firma

on:
  workflow_dispatch:

jobs:
  prueba:
    name: Comprobar el secreto
    runs-on: ubuntu-latest
    steps:
      - name: Leer el secreto
        env:
          CLAVE_FIRMA: ${{ secrets.CLAVE_FIRMA_ANDROID }}
        run: |
          if [ -z "${CLAVE_FIRMA}" ]; then
            echo "El secreto llega vacio"
          else
            echo "El secreto llega con ${#CLAVE_FIRMA} caracteres"
          fi
